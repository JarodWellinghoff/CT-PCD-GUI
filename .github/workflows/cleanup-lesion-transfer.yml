name: Cleanup lesion integration transfer files

on:
  push:
    branches:
      - feature/lesion-insertion-module
    paths:
      - .github/workflows/cleanup-lesion-transfer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lesion-insertion-module
          fetch-depth: 0

      - name: Verify implementation and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          test -f src/ct_pcd_gui/features/lesion_insertion/domain/models.py
          test -f src/ct_pcd_gui/features/lesion_insertion/presentation/presenter.py
          rm -f tools/lesion_patch.b64.part*
          rm -f tmp-lesion-transfer-test.txt CLEANUP_INSTRUCTIONS.txt
          rm -f .github/workflows/apply-lesion-patch.yml
          rm -f .github/workflows/finalize-lesion-patch.yml
          rm -f .github/workflows/finalize-lesion-integration.yml
          rm -f .github/workflows/publish-lesion-integration.yml
          rm -f .github/workflows/cleanup-lesion-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove lesion integration transfer files"
            git push origin HEAD:feature/lesion-insertion-module
          fi
