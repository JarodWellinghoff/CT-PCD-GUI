name: Publish lesion insertion integration

on:
  push:
    branches:
      - feature/lesion-insertion-module
    paths:
      - .github/workflows/publish-lesion-integration.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lesion-insertion-module
          fetch-depth: 0

      - name: Materialize implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/ct_pcd_gui/features/lesion_insertion/domain/models.py ]; then
            cat tools/lesion_patch.b64.part* > /tmp/lesion_patch.tar.gz.b64
            echo "239db9c5f191e4548300a913acfe81ba2588e8b48bd2fa50e04488f6bd8a6d4d  /tmp/lesion_patch.tar.gz.b64" | sha256sum --check -
            base64 --decode /tmp/lesion_patch.tar.gz.b64 > /tmp/lesion_patch.tar.gz
            echo "9b855232a7ed8e92f2a024fbda4da3ab9c158debb78684410020220853c7e858  /tmp/lesion_patch.tar.gz" | sha256sum --check -
            tar -xzf /tmp/lesion_patch.tar.gz -C .
          fi
          if [ ! -d src/ct_pcd_gui/features/lesion_insertion/_vendor/lesion_pipeline ]; then
            cp -a archive/legacy/original_code/Python_lesion_insertion_3.1.4/lesion_pipeline \
              src/ct_pcd_gui/features/lesion_insertion/_vendor/lesion_pipeline
          fi
          test -f src/ct_pcd_gui/features/lesion_insertion/domain/models.py
          test -f src/ct_pcd_gui/features/lesion_insertion/presentation/presenter.py
          test -f tests/unit/test_lesion_insertion_domain.py

      - name: Run focused tests
        id: tests
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest pydicom
          PYTHONPATH=src pytest -q tests/unit/test_lesion_insertion_*.py 2>&1 | tee /tmp/lesion-tests.txt
          status=${PIPESTATUS[0]}
          python -m compileall -q src tests
          summary=$(tail -n 1 /tmp/lesion-tests.txt | tr -d '\r')
          {
            echo 'TEST_SUMMARY<<EOF'
            echo "$summary"
            echo 'EOF'
            echo "TEST_STATUS=$status"
          } >> "$GITHUB_ENV"
          exit "$status"

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/lesion_patch.b64.part*
          rm -f tmp-lesion-transfer-test.txt CLEANUP_INSTRUCTIONS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs pyproject.toml src tests tools tmp-lesion-transfer-test.txt CLEANUP_INSTRUCTIONS.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Integrate lesion insertion module"
            if ! git push origin HEAD:feature/lesion-insertion-module; then
              git fetch origin feature/lesion-insertion-module
              if git cat-file -e origin/feature/lesion-insertion-module:src/ct_pcd_gui/features/lesion_insertion/domain/models.py 2>/dev/null; then
                git reset --hard origin/feature/lesion-insertion-module
              else
                git rebase origin/feature/lesion-insertion-module
                git push origin HEAD:feature/lesion-insertion-module
              fi
            fi
          fi

      - name: Update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<EOF
          ## Summary

          Integrates the coworker's lesion-insertion pipeline into the existing PySide6 workbench as a production-oriented **Lesion Insertion** module.

          - Metadata-based DICOM series discovery, physical ordering, raw-data inspection, and association validation.
          - Real MAT/NPZ lesion-library access with search, metadata, thumbnail generation, and malformed-record handling.
          - Interactive 3-D placement with crosshairs, slice navigation, zoom, pan, window/level, and approximate before/overlay/after preview.
          - Independent multiple-lesion state, contrast, XYZ scale and rotation, per-channel background HU, opacity, visibility, enable/disable, duplicate, reorder, undo/redo, and session save/load.
          - Final processing through the coworker's DICOM-CT-PD pipeline 3.1.4, safe staging, progress/cancellation boundaries, optional external reconstruction, and a reproducibility manifest.
          - Explicit rejection of unsupported final coordinate mappings instead of silent spatial approximation.

          ## Validation

          Focused lesion-insertion tests: **${TEST_SUMMARY:-not available}**

          Python sources were compiled with `compileall`. The module and preview are labeled for research use. Real scanner data, the site reconstruction executable, and domain-expert spatial/scientific validation remain external validation requirements.

          ## Documentation

          See `docs/lesion_insertion.md` for workflow, coordinate conventions, output contents, external reconstruction integration, limitations, and the manual test checklist.
          EOF
          gh pr edit feature/lesion-insertion-module \
            --repo JarodWellinghoff/CT-PCD-GUI \
            --title "Integrate lesion insertion module" \
            --body-file /tmp/pr-body.md
