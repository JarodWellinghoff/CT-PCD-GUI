[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-ctpd-noise-gui"
version = "0.1.0"
description = "PySide6 workbench for DICOM-CT-PD processing and lesion-model workflows"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "pydicom>=2.4,<4",
    "scipy>=1.11",
    "vtk>=9.3",
    "h5py>=3.10",
    "pynrrd>=1.0",
]

[project.optional-dependencies]
comparison = [
    "matplotlib>=3.8",
    "scikit-image>=0.22",
]
conversion = [
    "tqdm>=4.66",
]
lesion-extraction = [
    "SimpleITK>=2.3",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
ct-pcd-gui = "ct_pcd_gui.bootstrap:main"
ct-pcd-compare-noise = "ct_pcd_gui.cli.compare_noise:main"
ct-pcd-combine = "ct_pcd_gui.cli.combine_dicom:main"
ct-pcd-extract-frames = "ct_pcd_gui.cli.extract_dicom_frames:main"
ct-pcd-extract-lesions = "ct_pcd_gui.cli.extract_lesions:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ct_pcd_gui = [
    "resources/styles/*.qss",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
